server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) re-resolves "invidious" on every request instead
    # of once at nginx startup. Without this, a recreated invidious container gets a new
    # IP and this proxy keeps hammering the old one with connection-refused until someone
    # restarts aura-app by hand.
    resolver 127.0.0.11 valid=10s;

    location ~* ^/(selfhost|deploy|tests|docs)(/|$) {
        deny all;
    }

    location ~* \.(env|log)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    # Public guest APIs use a listener that has no host operations. Never forward an
    # identity supplied on a public request to the authenticated listener.
    location ^~ /guest/api/ {
        set $guest_upstream http://aura-queue:8092;
        proxy_pass $guest_upstream;
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header Authorization "";
        client_max_body_size 8k;
        add_header Cache-Control "no-store" always;
    }

    location = /guest/ {
        try_files /guest/index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src https://i.ytimg.com; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location ~ ^/guest/(app\.js|i18n\.js|style\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/media/ticket {
        set $media_issuer http://aura-media:8093;
        proxy_pass $media_issuer;
        proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
        client_max_body_size 8k;
    }

    location = /media/play {
        set $media_playback http://aura-media:8094;
        proxy_pass $media_playback;
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        # Ticket URLs are bearer capabilities and do not belong in access logs.
        access_log off;
    }

    location /api/queue/ {
        set $queue_upstream http://aura-queue:8091;
        proxy_pass $queue_upstream;
        proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
        client_max_body_size 8k;
        # The host's own requests carry the live invite token in the path; it does not
        # belong in access logs any more than a media ticket does.
        access_log off;
    }

    location /api/sync/ {
        set $sync_upstream http://aura-sync:8088;
        proxy_pass $sync_upstream;
        proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4m;
    }

    location /api/push/ {
        set $push_upstream http://aura-push:8089;
        proxy_pass $push_upstream;
        proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 64k;
    }

    location /api/mix/ {
        set $mix_upstream http://aura-mix:8090;
        proxy_pass $mix_upstream;
        proxy_set_header X-Forwarded-Email $http_x_forwarded_email;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 8k;
        # A rebuild asked for by hand runs an AI call and a few dozen searches before it
        # answers, which is well past nginx's default minute.
        proxy_read_timeout 300s;
    }

    location /api/ {
        set $invidious_upstream http://invidious:3000;
        proxy_pass $invidious_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /videoplayback {
        set $invidious_upstream http://invidious:3000;
        proxy_pass $invidious_upstream;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_force_ranges on;
    }

    location /latest_version {
        set $invidious_upstream http://invidious:3000;
        proxy_pass $invidious_upstream;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /vi/ {
        set $invidious_upstream http://invidious:3000;
        proxy_pass $invidious_upstream;
        proxy_set_header Host $host;
    }

    # Reads a public playlist page on the app's behalf. The browser cannot fetch
    # open.spotify.com itself - no CORS headers there - and the public relays that stood in
    # for it are refused often enough that an import just fails. This host can fetch it
    # directly, and to the browser it is same-origin, so no CORS is involved at all.
    #
    # Called as /relay?url=https://open.spotify.com/embed/playlist/ID - the URL arrives
    # readable rather than percent-encoded, because plain nginx has no way to unescape a
    # query value. Only these hosts are allowed through, so this is not an open proxy,
    # and nothing else on the machine is reachable this way. YouTube is limited to the
    # channel feeds the app reads for new releases; without that entry every feed read
    # from the private app fell through to public CORS proxies.
    location = /relay {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $relay_target $arg_url;
        if ($relay_target !~ "^https://(open\.spotify\.com/|music\.apple\.com/|r\.jina\.ai/|www\.youtube\.com/feeds/videos\.xml\?)") {
            return 403;
        }
        proxy_pass $relay_target;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        # Playlist sites must not receive the private app's login credentials.
        proxy_pass_request_headers off;
        proxy_set_header Accept-Language "en-US,en;q=0.9";
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Only client assets are public. In particular, a non-dot *.env file is not an asset.
    # A file the pages load has to be allowed here as well: left out, it answers 404, the
    # next service worker cannot install its shell, and a script that depends on it stops
    # the app halfway through starting. A test holds this rule to what the pages ask for.
    # src/ holds nothing but client code, so any script or stylesheet in it, or one folder
    # down (src/views/home.js), is served: a module split into smaller files needs no edit
    # here. Only .js and .css - editor files such as src/globals.d.ts stay private.
    # app-revision.txt is written by auto-deploy.sh: the commit served, for sw.js.
    location ~ ^/(index\.html|manifest\.json|config\.json|app-revision\.txt|sw\.js|audio-check\.html|aura\.css|tokens\.css|icon\.svg|icon-180\.png|icons/shortcut-(ai|downloaded|liked|search)\.png|src/([a-z0-9-]+/)?[a-z0-9-]+\.(js|css))$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Still behind the login proxy. A Cast device needs the receiver hosted on a
    # public HTTPS origin (see docs/tv-playback.md); it cannot complete this login.
    location ~ ^/tv/(index\.html|receiver\.js|style\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }
}
